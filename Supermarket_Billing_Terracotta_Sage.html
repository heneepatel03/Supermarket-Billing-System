nt-size:27px;letter-spacing:-1px;margin:0 0 8px}header p{color:var(--muted);margin:0}.headright{display:flex;align-items:center;gap:17px}.date{color:#8d7b70;font-size:12px;font-weight:700}.avatar{background:#efd8c4;color:var(--blue);border-radius:50%;width:40px;height:40px;display:grid;place-items:center;font-weight:800}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px;margin-bottom:22px}.card,.panel{background:#fffaf4;border:1px solid var(--line);border-radius:16px;box-shadow:0 5px 18px #563a2610}.card{padding:23px}.metric-top{display:flex;justify-content:space-between;color:#8c7a6f;font-weight:700;font-size:12px}.metric-icon{width:38px;height:38px;display:grid;place-items:center;border-radius:10px;background:#f2dfcf;color:var(--blue);font-size:20px}.metric{font-family:'Plus Jakarta Sans';font-size:27px;font-weight:800;margin:14px 0 5px}.metric-note{color:#9a887c;font-size:11px}.grid2{display:grid;grid-template-columns:1.45fr 1fr;gap:20px}.panel{padding:24px;margin-bottom:20px}.panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px}.panel h2{font-size:16px;letter-spacing:-.4px;margin:0}.panel p.sub{color:var(--muted);font-size:12px;margin:7px 0 0}.btn{background:var(--blue);color:white;border:0;padding:11px 17px;border-radius:9px;font-weight:700;font-family:inherit;cursor:pointer}.btn:hover{filter:brightness(.94)}.btn.secondary{background:#f2dfcf;color:var(--blue)}.btn.danger{background:#fffaf40f0;color:#a64b4d}.btn.small{font-size:11px;padding:8px 12px}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.input,select{padding:11px 12px;border:1px solid #dfcfc1;border-radius:9px;background:#fffaf4;color:var(--ink);font:inherit;outline:none;min-width:0}.input:focus,select:focus{border-color:var(--blue)}.search{width:240px;max-width:100%}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;text-align:left;white-space:nowrap}th{background:#f2e6d9;color:#917e72;text-transform:uppercase;font-size:10px;letter-spacing:.8px;padding:13px 12px}td{padding:15px 12px;border-bottom:1px solid #e8d9cc;font-size:12px}tr:last-child td{border-bottom:0}.tag{display:inline-block;border-radius:7px;padding:6px 9px;font-weight:700;font-size:10px;background:#e7eddf;color:#577e57}.tag.warn{background:#fffaf45e6;color:#9f741e}.tag.blue{background:#f2dfcf;color:#a45d38}.muted{color:var(--muted)}.bar-chart{height:210px;display:flex;align-items:flex-end;gap:15px;border-bottom:1px solid #e6d8ca;padding:15px 8px 0}.bar-group{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:8px;min-width:0}.bar{width:min(40px,80%);background:linear-gradient(180deg,#a95b3b,#e4a876);border-radius:7px 7px 0 0;min-height:3px}.bar-group small{font-size:10px;color:#917e72}.split{display:grid;grid-template-columns:1.3fr .9fr;gap:20px}.field{display:grid;gap:7px;font-size:12px;color:#806d61;font-weight:700}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px;margin-bottom:18px}.full{grid-column:1/-1}.bill-line{display:flex;align-items:center;gap:10px;margin-bottom:10px}.bill-line select{flex:1}.bill-line input{width:78px}.bill-line button{padding:10px}.summary-row{display:flex;justify-content:space-between;padding:12px 0;border-bottom:1px solid var(--line)}.summary-row.total{font-size:20px;font-weight:800;color:var(--blue);border:0}.empty{color:#a9998d;text-align:center;padding:36px 10px}.team-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:17px}.member{text-align:center;padding:28px 12px}.member .circle{margin:0 auto 15px;width:60px;height:60px;border-radius:18px;display:grid;place-items:center;background:#f0ddcb;color:var(--blue);font-size:21px;font-weight:800}.member h3{margin:0 0 9px;font-size:15px}.member p{color:var(--muted);margin:0;font-size:12px}.info-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}.info{padding:18px;background:#f1e5d9;border-radius:11px}.info strong{display:block;margin-top:6px}.pill{display:inline-block;background:#e3ecd9;color:#597a4c;border-radius:20px;padding:6px 11px;font-size:11px;font-weight:700}footer{font-size:11px;color:#9e8c7e;margin:28px 0 0;text-align:center}#toast{position:fixed;right:25px;bottom:25px;background:#3c2c25;color:white;padding:14px 20px;border-radius:11px;box-shadow:0 10px 35px #0003;display:none;z-index:20}#toast.show{display:block}@media(max-width:1100px){.stats{grid-template-columns:repeat(2,1fr)}.grid2,.split{grid-template-columns:1fr}}@media(max-width:700px){.sidebar{width:68px;padding:18px 8px}.brand{padding:0 0 30px;justify-content:center}.brand>div,.navlabel,nav button span,.sidebar-bottom{display:none}nav button{justify-content:center;padding:12px}.team-grid{grid-template-columns:1fr}.stats{grid-template-columns:1fr 1fr;gap:9px}.card{padding:15px}.metric{font-size:21px}main{padding:22px 14px}.date{display:none}.formgrid,.info-grid{grid-template-columns:1fr}h1{font-size:22px}}

</style></head><body><div class="app"><aside class="sidebar"><div class="brand"><span class="brand-icon">▦</span><div>Super<span>Mart</span><small>Billing Management</small></div></div><div class="navlabel">WORKSPACE</div><nav id="nav"><button class="active" data-page="overview">◫ <span>Overview</span></button><button data-page="billing">▤ <span>New Billing</span></button><button data-page="products">▣ <span>Products & Inventory</span></button><button data-page="transactions">⇄ <span>Transactions</span></button><button data-page="cashiers">♙ <span>Cashiers</span></button><button data-page="team">♧ <span>Project Team</span></button></nav><div class="sidebar-bottom"><div class="status"><span class="dot"></span> Browser demo · Local data</div><small>DBMS Mini Project · 2026–27</small></div></aside><main><header><div><div class="crumb">Workspace / <span id="breadcrumb">Overview</span></div><h1 id="heading">Dashboard Overview</h1><p id="subheading">Here's what's happening at your supermarket.</p></div><div class="headright"><span class="date" id="today"></span><div class="avatar">SM</div></div></header><div id="content"></div><footer>Supermarket Billing System · A.D. Patel Institute of Technology · Guided by Yamini Dubey</footer></main></div><div id="toast" role="status"></div><script>
const seed={products:[{id:1,barcode:'890100001',name:'Fresh Milk 1L',category:'Dairy',price:60,tax:5,stock:42},{id:2,barcode:'890100002',name:'Basmati Rice 1kg',category:'Grocery',price:145,tax:5,stock:32},{id:3,barcode:'890100003',name:'Potato Chips',category:'Snacks',price:30,tax:12,stock:9},{id:4,barcode:'890100004',name:'Hand Wash',category:'Personal Care',price:110,tax:18,stock:17}],cashiers:[{id:1,name:'Cashier One',username:'cashier01'},{id:2,name:'Cashier Two',username:'cashier02'},{id:3,name:'Cashier Three',username:'cashier03'},{id:4,name:'Cashier Four',username:'cashier04'}],transactions:[]};let state;try{state=JSON.parse(localStorage.getItem('supermart_demo_v1'))||structuredClone(seed)}catch{state=structuredClone(seed)}let cart=[];let page='overview';const $=s=>document.querySelector(s),money=n=>'₹'+Number(n||0).toLocaleString('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2}),save=()=>localStorage.setItem('supermart_demo_v1',JSON.stringify(state)),safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),toast=s=>{let t=$('#toast');t.textContent=s;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)},head={overview:['Dashboard Overview',"Here's what's happening at your supermarket."],billing:['Create New Bill','Select products and generate an itemized tax invoice.'],products:['Products & Inventory','Manage product details, tax rates and stock.'],transactions:['Transaction History','Review recorded bills and print invoices.'],cashiers:['Cashier Management','Maintain cashier accounts for checkout.'],team:['Project Team','Meet the students behind this DBMS mini project.']};function navigate(p){page=p;$('#breadcrumb').textContent=p[0].toUpperCase()+p.slice(1);$('#heading').textContent=head[p][0];$('#subheading').textContent=head[p][1];document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));render()}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>navigate(b.dataset.page));$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'});const sum=arr=>arr.reduce((a,b)=>a+b,0);function render(){({overview,products,billing,transactions,cashiers,team})[page]()}function overview(){let tx=state.transactions,revenue=sum(tx.map(t=>t.total)),low=state.products.filter(p=>p.stock<=10),cat={};tx.forEach(t=>t.items.forEach(i=>cat[i.category]=(cat[i.category]||0)+i.subtotal));let top=Object.entries(cat).sort((a,b)=>b[1]-a[1]);$('#content').innerHTML=`<div class="stats">${[['Total Revenue',money(revenue),'↗','Across recorded transactions'],['Total Transactions',tx.length,'▤','Bills generated'],['Active Products',state.products.length,'▣','Products in inventory'],['Low Stock Alerts',low.length,'!','10 units or fewer']].map(a=>`<div class="card"><div class="metric-top"><span>${a[0]}</span><span class="metric-icon">${a[2]}</span></div><div class="metric">${a[1]}</div><div class="metric-note">${a[3]}</div></div>`).join('')}</div><div class="grid2"><section class="panel"><div class="panel-head"><div><h2>Sales by Category</h2><p class="sub">Revenue distribution from recorded bills</p></div></div>${top.length?`<div class="bar-chart">${top.map(([k,v])=>`<div class="bar-group"><strong style="font-size:10px">${money(v)}</strong><div class="bar" style="height:${Math.max(5,v/top[0][1]*155)}px"></div><small>${safe(k)}</small></div>`).join('')}</div>`:'<div class="empty">Create a bill to see your sales chart.</div>'}</section><section class="panel"><div class="panel-head"><div><h2>Inventory Alerts</h2><p class="sub">Products that need restocking</p></div><button class="btn secondary small" onclick="navigate('products')">View inventory</button></div>${low.length?low.map(p=>`<div class="summary-row"><span>${safe(p.name)}</span><span class="tag warn">${p.stock} left</span></div>`).join(''):'<div class="empty">All products have healthy stock levels.</div>'}</section></div><section class="panel"><div class="panel-head"><div><h2>Recent Transactions</h2><p class="sub">Latest checkout activity</p></div><button class="btn secondary small" onclick="navigate('billing')">+ Create bill</button></div>${transactionTable(tx.slice(-5).reverse())}</section>`}function transactionTable(rows){return rows.length?`<div class="tablewrap"><table><thead><tr><th>Bill ID</th><th>Date</th><th>Cashier</th><th>Items</th><th>Tax</th><th>Grand Total</th><th>Action</th></tr></thead><tbody>${rows.map(t=>`<tr><td><b>#${String(t.id).padStart(4,'0')}</b></td><td>${new Date(t.date).toLocaleString('en-IN')}</td><td>${safe(t.cashier)}</td><td>${sum(t.items.map(i=>i.qty))}</td><td>${money(t.tax)}</td><td><b>${money(t.total)}</b></td><td><button class="btn secondary small" onclick="printBill(${t.id})">Invoice ↗</button></td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">No transactions yet. Create your first bill from New Billing.</div>'}function products(){let q=($('#productSearch')?.value||'').toLowerCase();let rows=state.products.filter(p=>(p.name+' '+p.category+' '+p.barcode).toLowerCase().includes(q));$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Product Catalogue</h2><p class="sub">${state.products.length} products · stock updated after billing</p></div><div class="toolbar"><input id="productSearch" class="input search" placeholder="Search products..." value="${safe(q)}"><button class="btn" onclick="productForm()">+ Add Product</button></div></div><div id="productRows">${productRows(rows)}</div></section><section id="productForm"></section>`;$('#productSearch').oninput=e=>{$('#productRows').innerHTML=productRows(state.products.filter(p=>(p.name+' '+p.category+' '+p.barcode).toLowerCase().includes(e.target.value.toLowerCase())))}}function productRows(rows){return `<div class="tablewrap"><table><thead><tr><th>ID</th><th>Product / Barcode</th><th>Category</th><th>Price</th><th>Tax</th><th>Stock</th><th>Action</th></tr></thead><tbody>${rows.map(p=>`<tr><td>#${p.id}</td><td><b>${safe(p.name)}</b><div class="muted">${safe(p.barcode)}</div></td><td>${safe(p.category)}</td><td>${money(p.price)}</td><td>${p.tax}%</td><td><span class="tag ${p.stock<=10?'warn':''}">${p.stock} units</span></td><td><button class="btn secondary small" onclick="productForm(${p.id})">Edit</button></td></tr>`).join('')}</tbody></table></div>`}function productForm(id){let p=state.products.find(x=>x.id===id)||{name:'',barcode:'',category:'Grocery',price:'',tax:5,stock:0};$('#productForm').innerHTML=`<div class="panel"><div class="panel-head"><h2>${id?'Edit':'Add'} Product</h2><button class="btn secondary small" onclick="$('#productForm').innerHTML=''">Close</button></div><form id="pf" class="formgrid"><label class="field">Product name<input class="input" name="name" maxlength="30" required value="${safe(p.name)}"></label><label class="field">Barcode<input class="input" name="barcode" maxlength="30" required value="${safe(p.barcode)}"></label><label class="field">Category<input class="input" name="category" maxlength="50" required value="${safe(p.category)}"></label><label class="field">Unit price (₹)<input class="input" type="number" name="price" step="0.01" min="0" required value="${p.price}"></label><label class="field">Tax rate (%)<input class="input" type="number" name="tax" step="0.01" min="0" max="100" required value="${p.tax}"></label><label class="field">Stock quantity<input class="input" type="number" name="stock" min="0" step="1" required value="${p.stock}"></label><div class="full"><button class="btn" type="submit">Save Product</button></div></form></div>`;$('#pf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),v={id:id||Math.max(0,...state.products.map(p=>p.id))+1,name:f.get('name').trim(),barcode:f.get('barcode').trim(),category:f.get('category').trim(),price:+f.get('price'),tax:+f.get('tax'),stock:+f.get('stock')};if(state.products.some(p=>p.barcode===v.barcode&&p.id!==v.id))return toast('Barcode must be unique');if(id)state.products=state.products.map(p=>p.id===id?v:p);else state.products.push(v);save();toast('Product saved successfully');products()}}function billing(){cart=cart.filter(i=>state.products.some(p=>p.id===i.id));$('#content').innerHTML=`<div class="split"><section class="panel"><div class="panel-head"><div><h2>Checkout Counter</h2><p class="sub">Choose cashier and add products</p></div><span class="pill">New transaction</span></div><label class="field">Cashier<select id="billCashier">${state.cashiers.map(c=>`<option value="${c.id}">${safe(c.name)} (${safe(c.username)})</option>`).join('')}</select></label><div style="height:18px"></div><div class="panel-head"><h2>Cart Items</h2><button class="btn secondary small" onclick="addLine()">+ Add item</button></div><div id="cartRows"></div></section><section class="panel"><h2>Bill Summary</h2><p class="sub">Automatic subtotal and item-wise tax</p><div style="height:24px"></div><div id="billSummary"></div><button class="btn" style="width:100%;margin-top:22px" onclick="checkout()">Generate Bill & Save Transaction</button><p class="sub" style="margin-top:16px">Stock quantities are reduced only after a bill is saved.</p></section></div>`;if(!cart.length)addLine();else drawCart()}function addLine(){let first=state.products.find(p=>p.stock>0);if(!first)return toast('No products available in stock');cart.push({id:first.id,qty:1});drawCart()}function drawCart(){let el=$('#cartRows');if(!el)return;el.innerHTML=cart.map((i,n)=>`<div class="bill-line"><select onchange="changeItem(${n},this.value)">${state.products.map(p=>`<option value="${p.id}" ${p.id===i.id?'selected':''} ${p.stock<1?'disabled':''}>${safe(p.name)} · ${money(p.price)} · ${p.stock} left</option>`).join('')}</select><input class="input" type="number" min="1" step="1" value="${i.qty}" onchange="changeQty(${n},this.value)" title="Quantity"><button class="btn danger small" onclick="cart.splice(${n},1);drawCart()">×</button></div>`).join('')||'<div class="empty">Your cart is empty.</div>';let items=cart.map(i=>{let p=state.products.find(x=>x.id===i.id);return p?{subtotal:p.price*i.qty,tax:p.price*i.qty*p.tax/100}:null}).filter(Boolean);let subtotal=sum(items.map(i=>i.subtotal)),tax=sum(items.map(i=>i.tax));$('#billSummary').innerHTML=`<div class="summary-row"><span>Items</span><b>${sum(cart.map(i=>i.qty))}</b></div><div class="summary-row"><span>Subtotal</span><b>${money(subtotal)}</b></div><div class="summary-row"><span>Total tax</span><b>${money(tax)}</b></div><div class="summary-row total"><span>Grand Total</span><span>${money(subtotal+tax)}</span></div>`}function changeItem(n,v){cart[n].id=+v;drawCart()}function changeQty(n,v){cart[n].qty=+v;drawCart()}function checkout(){if(!cart.length)return toast('Add at least one item');let qty={};for(let i of cart){if(!Number.isInteger(i.qty)||i.qty<1)return toast('Enter valid whole-number quantities');qty[i.id]=(qty[i.id]||0)+i.qty}for(let [id,n] of Object.entries(qty)){let p=state.products.find(p=>p.id===+id);if(!p||p.stock<n)return toast('Insufficient stock for '+(p?.name||'product'))}let cashier=state.cashiers.find(c=>c.id===+$('#billCashier').value);if(!cashier)return toast('Select a cashier');let items=cart.map(i=>{let p=state.products.find(p=>p.id===i.id);return {id:p.id,name:p.name,category:p.category,qty:i.qty,price:p.price,rate:p.tax,subtotal:+(i.qty*p.price).toFixed(2),tax:+(i.qty*p.price*p.tax/100).toFixed(2)}});let subtotal=+sum(items.map(i=>i.subtotal)).toFixed(2),tax=+sum(items.map(i=>i.tax)).toFixed(2);let t={id:Math.max(0,...state.transactions.map(t=>t.id))+1,date:new Date().toISOString(),cashier:cashier.name,cashierId:cashier.id,items,subtotal,tax,total:+(subtotal+tax).toFixed(2)};Object.entries(qty).forEach(([id,n])=>state.products.find(p=>p.id===+id).stock-=n);state.transactions.push(t);save();cart=[];toast('Bill generated successfully');navigate('transactions');printBill(t.id)}function transactions(){let q='';$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>All Transactions</h2><p class="sub">${state.transactions.length} saved bills</p></div><input id="transactionSearch" class="input search" placeholder="Search bill ID or cashier"></div><div id="transactionRows">${transactionTable([...state.transactions].reverse())}</div></section>`;$('#transactionSearch').oninput=e=>{$('#transactionRows').innerHTML=transactionTable([...state.transactions].reverse().filter(t=>('#'+t.id+' '+t.cashier).toLowerCase().includes(e.target.value.toLowerCase())))}}function cashiers(){$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Registered Cashiers</h2><p class="sub">Each transaction is assigned to one cashier</p></div><button class="btn" onclick="cashierForm()">+ Add Cashier</button></div><div class="tablewrap"><table><thead><tr><th>Cashier ID</th><th>Full Name</th><th>Username</th><th>Transactions</th></tr></thead><tbody>${state.cashiers.map(c=>`<tr><td>#${c.id}</td><td><b>${safe(c.name)}</b></td><td>${safe(c.username)}</td><td>${state.transactions.filter(t=>t.cashierId===c.id).length}</td></tr>`).join('')}</tbody></table></div></section><div id="cashierForm"></div>`}function cashierForm(){$('#cashierForm').innerHTML=`<section class="panel"><h2>Add Cashier</h2><form id="cf" class="formgrid" style="margin-top:20px"><label class="field">Cashier name<input class="input" name="name" required maxlength="100"></label><label class="field">Unique username<input class="input" name="username" required maxlength="50"></label><button class="btn" type="submit">Save Cashier</button></form></section>`;$('#cf').onsubmit=e=>{e.preventDefault();let f=new FormData(e.target),username=f.get('username').trim();if(state.cashiers.some(c=>c.username===username))return toast('Username must be unique');state.cashiers.push({id:Math.max(0,...state.cashiers.map(c=>c.id))+1,name:f.get('name').trim(),username});save();toast('Cashier added');cashiers()}}function team(){$('#content').innerHTML=`<section class="panel"><div class="panel-head"><div><h2>Meet the Project Team</h2><p class="sub">Supermarket Billing System · Database Management System</p></div><span class="pill">Academic Year 2026–27</span></div><div class="team-grid">${[['DB','Dhvani Barot','12502080601025'],['DP','Drashti Patel','12502080601029'],['HP','Henee Patel','12502080601036']].map(m=>`<div class="card member"><div class="circle">${m[0]}</div><h3>${m[1]}</h3><p>Enrollment: ${m[2]}</p><p style="margin-top:8px">B.Tech · Information Technology</p></div>`).join('')}</div></section><section class="panel"><h2>Project Information</h2><div class="info-grid" style="margin-top:20px"><div class="info"><span class="muted">Institute</span><strong>A.D. Patel Institute of Technology</strong></div><div class="info"><span class="muted">Faculty Guide</span><strong>Yamini Dubey</strong></div><div class="info"><span class="muted">Department</span><strong>Information Technology · 2nd Year</strong></div><div class="info"><span class="muted">Technology</span><strong>HTML · CSS · JavaScript · MySQL 8.0 (project database)</strong></div></div><p class="sub" style="margin-top:18px">This dashboard is a browser-based demonstration of the four-table project model: Products, Cashiers, Transactions and Cart_Items. Data is saved locally in your browser; a server API is required for live MySQL connectivity.</p></section>`}function printBill(id){let t=state.transactions.find(t=>t.id===id);if(!t)return;let w=window.open('','_blank');if(!w)return toast('Allow pop-ups to print the invoice');let doc=`<!doctype html><html><head><title>Invoice ${t.id}</title><style>body{font-family:Arial;max-width:720px;margin:40px auto;color:#24354c}h1{margin-bottom:4px}small{color:#778}table{width:100%;border-collapse:collapse;margin:25px 0}td,th{padding:12px;border-bottom:1px solid #ddd;text-align:left}th{background:#f1f5ff}.total{text-align:right;font-size:20px;font-weight:bold}.meta{line-height:1.9}@media print{button{display:none}}

</style></head><body><h1>SuperMart</h1><small>SUPERMARKET TAX INVOICE</small><hr><div class="meta">Invoice: #${String(t.id).padStart(4,'0')}<br>Date: ${new Date(t.date).toLocaleString('en-IN')}<br>Cashier: ${safe(t.cashier)}</div><table><thead><tr><th>Product</th><th>Qty</th><th>Price</th><th>Tax</th><th>Line Total</th></tr></thead><tbody>${t.items.map(i=>`<tr><td>${safe(i.name)}</td><td>${i.qty}</td><td>${money(i.price)}</td><td>${i.rate}%</td><td>${money(i.subtotal+i.tax)}</td></tr>`).join('')}</tbody></table><p>Subtotal: ${money(t.subtotal)}</p><p>Total Tax: ${money(t.tax)}</p><div class="total">Grand Total: ${money(t.total)}</div><hr><p>Thank you for shopping with us!</p><button onclick="window.print()">Print Invoice</button></body></html>`;w.document.write(doc);w.document.close()}navigate('overview');
